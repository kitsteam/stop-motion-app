# Cache-Control profile per URL. Vite emits hashed filenames under /assets/,
# so those are safe to cache aggressively; the app shell, service worker, and
# web app manifest must always revalidate so a deploy is picked up on reload.
map $uri $cache_control {
    default                          "no-cache";
    "~^/assets/"                     "public, max-age=31536000, immutable";
    "~\.wasm$"                       "public, max-age=604800";
}

server {
    listen       8080;
    server_name  localhost;

    add_header Referrer-Policy strict-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $cache_control always;

    port_in_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json text/html application/wasm image/svg+xml;

    # SPA fallback: serve index.html for any unknown path so React Router can
    # render /animator, /settings, etc. on direct navigation and reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
