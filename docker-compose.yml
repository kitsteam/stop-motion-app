services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        # Set APP_FLAVOR=react in your environment (or in .env) to build the
        # React dev image instead of the default Angular one.
        APP_FLAVOR: ${APP_FLAVOR:-angular}
    container_name: stop-motion-app
    stdin_open: true
    ports:
      - "${DOCKER_COMPOSE_APP_PORT_PUBLISHED:-4200}:4200"
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - react_node_modules:/home/node/app/react-app/node_modules

volumes:
  node_modules: # Will be prefixed with stop-motion-app
  react_node_modules: # Will be prefixed with stop-motion-app
