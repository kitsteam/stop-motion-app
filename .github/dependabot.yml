
# cooldown.default-days: 7 matches pnpm-workspace.yaml minimumReleaseAge: 10080.
# Security updates are exempt from cooldown (Dependabot rule).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        versions: ["< 24", ">= 25"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      # Node base image is bumped manually on the Node LTS cycle.
      - dependency-name: "node"
        versions: ["< 24", ">= 25"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
